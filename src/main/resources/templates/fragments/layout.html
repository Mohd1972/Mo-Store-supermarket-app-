<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b2a24">
    <title>Mo Store | <span th:text="${title}">Dashboard</span></title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand"><i class="bi bi-shop" aria-hidden="true"></i> <span class="brand-name">Mo Store</span></div>
        <nav class="sidebar-nav" aria-label="Main navigation">
            <ul class="nav flex-column py-2">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${requestURI.startsWith('/dashboard')} ? 'active'"
                       th:href="@{/dashboard}"><i class="bi bi-speedometer2" aria-hidden="true"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${requestURI.startsWith('/sales/pos')} ? 'active'"
                       sec:authorize="hasAnyRole('ADMIN','CASHIER')" th:href="@{/sales/pos}"><i class="bi bi-cash-coin" aria-hidden="true"></i> POS Checkout</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${requestURI.startsWith('/sales') && !requestURI.startsWith('/sales/pos')} ? 'active'"
                       sec:authorize="hasAnyRole('ADMIN','CASHIER')" th:href="@{/sales}"><i class="bi bi-receipt" aria-hidden="true"></i> Sales History</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${requestURI.startsWith('/products')} ? 'active'"
                       sec:authorize="hasAnyRole('ADMIN','STOCK_MANAGER')" th:href="@{/products}"><i class="bi bi-box-seam" aria-hidden="true"></i> Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${requestURI.startsWith('/categories')} ? 'active'"
                       sec:authorize="hasAnyRole('ADMIN','STOCK_MANAGER')" th:href="@{/categories}"><i class="bi bi-tags" aria-hidden="true"></i> Categories</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${requestURI.startsWith('/suppliers')} ? 'active'"
                       sec:authorize="hasAnyRole('ADMIN','STOCK_MANAGER')" th:href="@{/suppliers}"><i class="bi bi-truck" aria-hidden="true"></i> Suppliers</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${requestURI.startsWith('/purchase-orders')} ? 'active'"
                       sec:authorize="hasAnyRole('ADMIN','STOCK_MANAGER')" th:href="@{/purchase-orders}"><i class="bi bi-box-arrow-in-down" aria-hidden="true"></i> Purchase Orders</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${requestURI.startsWith('/employees')} ? 'active'"
                       sec:authorize="hasRole('ADMIN')" th:href="@{/employees}"><i class="bi bi-people" aria-hidden="true"></i> Employees</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${requestURI.startsWith('/reports')} ? 'active'"
                       sec:authorize="hasAnyRole('ADMIN','CASHIER')" th:href="@{/reports}"><i class="bi bi-graph-up" aria-hidden="true"></i> Reports</a>
                </li>
            </ul>
        </nav>
    </aside>

    <main class="main-panel">
        <header class="topbar d-flex justify-content-between align-items-center">
            <h1 class="h5 mb-0 topbar-title" th:text="${title}">Page</h1>
            <div class="d-flex align-items-center gap-3">
                <span class="user-chip">
                    <i class="bi bi-person-circle" aria-hidden="true"></i>
                    <span class="fw-semibold" sec:authentication="name">user</span>
                    <span class="text-muted role-label" sec:authentication="principal.authorities">ROLE</span>
                </span>
                <form th:action="@{/logout}" method="post" class="d-inline mb-0">
                    <button class="btn btn-outline-secondary btn-sm" type="submit"><i class="bi bi-box-arrow-right" aria-hidden="true"></i> Logout</button>
                </form>
            </div>
        </header>

        <div class="main-content">
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert" aria-live="polite">
                <span th:text="${success}">success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" aria-live="assertive">
                <span th:text="${error}">error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <th:block th:replace="${content}"/>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
