<html th:replace="~{fragments/layout :: layout('Categories', ~{::content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Product Categories</h5>
        <a class="btn btn-sm-primary" th:href="@{/categories/new}"><i class="bi bi-plus-lg"></i> New Category</a>
    </div>
    <div class="card">
        <div class="card-body p-0">
            <table class="table mb-0">
                <thead><tr><th>Name</th><th>Description</th><th>Products</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:each="c : ${categories}">
                    <td th:text="${c.name}">name</td>
                    <td th:text="${c.description}">desc</td>
                    <td th:text="${#lists.size(c.products)}">0</td>
                    <td>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/categories/{id}/edit(id=${c.id})}" aria-label="Edit category"><i class="bi bi-pencil"></i></a>
                        <form class="d-inline" th:action="@{/categories/{id}/delete(id=${c.id})}" method="post"
                              onsubmit="return confirm('Delete this category?')">
                            <button class="btn btn-sm btn-outline-danger" type="submit" aria-label="Delete category"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(categories)}">
                    <td colspan="4" class="text-center text-muted">No categories</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
