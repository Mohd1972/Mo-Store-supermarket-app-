<html th:replace="~{fragments/layout :: layout('Point of Sale', ~{::content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="row g-3">
        <div class="col-md-7">
            <div class="card">
                <div class="card-body">
                    <form class="d-flex mb-3" th:action="@{/sales/pos/scan}" method="post">
                        <input type="text" name="code" class="form-control form-control-lg"
                               placeholder="Scan or type barcode / SKU ..." autocomplete="off" autofocus
                               aria-label="Scan code">
                        <input type="hidden" name="qty" value="1">
                        <input type="hidden" name="customerName" th:value="${cartCustomerName}">
                        <input type="hidden" name="discount" th:value="${cartDiscount}">
                        <input type="hidden" name="taxRate" th:value="${cartTaxRate}">
                        <button class="btn btn-sm-primary ms-2" type="submit" aria-label="Scan and add"><i class="bi bi-upc-scan"></i></button>
                    </form>
                    <div class="table-responsive" style="max-height:440px;overflow:auto;">
                        <table class="table table-hover table-sm mb-0">
                            <thead class="sticky-top"><tr>
                                <th>Product</th><th>Price</th><th>Stock</th><th></th>
                            </tr></thead>
                            <tbody>
                            <tr th:each="p : ${products}">
                                <td>
                                    <span th:text="${p.name}">name</span>
                                    <small class="text-muted d-block" th:text="${p.sku}">SKU</small>
                                </td>
                                <td th:text="'TSh ' + ${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}">0</td>
                                <td>
                                    <span class="badge" th:classappend="${p.lowStock} ? 'badge-lowstock' : 'text-bg-success'"
                                          th:text="${p.stock}"></span>
                                </td>
                                <td>
                                    <form class="d-flex" th:action="@{/sales/pos/add}" method="post">
                                        <input type="hidden" name="productId" th:value="${p.id}">
                                        <input type="number" name="qty" class="form-control form-control-sm me-1" style="width:60px" min="1" value="1">
                                        <input type="hidden" name="customerName" th:value="${cartCustomerName}">
                                        <input type="hidden" name="discount" th:value="${cartDiscount}">
                                        <input type="hidden" name="taxRate" th:value="${cartTaxRate}">
                                        <button class="btn btn-sm btn-sm-primary" type="submit" aria-label="Add to cart"><i class="bi bi-cart-plus"></i></button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(products)}">
                                <td colspan="4" class="text-center text-muted">No products found</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card">
                <div class="card-header bg-white fw-bold">Current Cart</div>
                <div class="card-body p-0">
                    <table class="table table-sm mb-0">
                        <thead><tr><th>Item</th><th class="text-center">Qty</th><th class="text-end">Total</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="item : ${cart}">
                            <td th:text="${item.product.name}">name</td>
                            <td class="text-center" th:text="${item.quantity}">0</td>
                            <td class="text-end" th:text="'TSh ' + ${#numbers.formatDecimal(item.lineTotal, 1, 'COMMA', 2, 'POINT')}">0</td>
                            <td>
                                <form th:action="@{/sales/pos/remove}" method="post">
                                    <input type="hidden" name="productId" th:value="${item.product.id}">
                                    <input type="hidden" name="customerName" th:value="${cartCustomerName}">
                                    <input type="hidden" name="discount" th:value="${cartDiscount}">
                                    <input type="hidden" name="taxRate" th:value="${cartTaxRate}">
                                    <button class="btn btn-sm btn-outline-danger" type="submit" aria-label="Remove from cart"><i class="bi bi-x"></i></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(cart)}">
                            <td colspan="4" class="text-center text-muted py-3">Cart is empty</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <form class="mt-3 card" th:action="@{/sales/pos/checkout}" method="post"
                  onsubmit="return confirm('Complete this sale?')">
                <div class="card-body p-3">
                    <div class="mb-2">
                        <label class="form-label small mb-1">Customer Name</label>
                        <input type="text" name="customerName" class="form-control form-control-sm"
                               th:value="${cartCustomerName}" placeholder="Optional">
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="form-label small mb-1">Discount (TSh)</label>
                            <input type="number" name="discount" step="0.01" min="0" class="form-control form-control-sm"
                                   th:value="${cartDiscount != null ? cartDiscount : 0}">
                        </div>
                        <div class="col-6">
                            <label class="form-label small mb-1">Tax Rate (%)</label>
                            <input type="number" name="taxRate" step="0.01" min="0" class="form-control form-control-sm"
                                   th:value="${cartTaxRate != null ? cartTaxRate : 0}">
                        </div>
                    </div>
                    <table class="table table-sm mb-0">
                        <tbody>
                        <tr><td>Subtotal</td><td class="text-end" th:text="'TSh ' + ${#numbers.formatDecimal(cartSubtotal, 1, 'COMMA', 2, 'POINT')}">0</td></tr>
                        </tbody>
                    </table>
                    <button class="btn btn-success w-100 btn-lg mt-2" type="submit"><i class="bi bi-cash-coin"></i> Complete Sale</button>
                </div>
            </form>
            <p class="text-muted small mt-2 mb-0">
                <i class="bi bi-info-circle"></i> Stock is reduced automatically on checkout. Scan or type a barcode/SKU to add items.
            </p>
        </div>
    </div>
</div>
</body>
</html>
