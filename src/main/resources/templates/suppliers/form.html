<html th:replace="~{fragments/layout :: layout(${supplier.id == null ? 'New Supplier' : 'Edit Supplier'}, ~{::content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="card">
        <div class="card-body">
            <form th:action="${supplier.id == null} ? @{/suppliers} : @{/suppliers/{id}(id=${supplier.id})}"
                  method="post" th:object="${supplier}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Company Name</label>
                        <input type="text" class="form-control" th:field="*{companyName}" required>
                        <div class="text-danger" th:errors="*{companyName}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Contact Name</label>
                        <input type="text" class="form-control" th:field="*{contactName}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" th:field="*{email}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" th:field="*{phone}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tax ID</label>
                        <input type="text" class="form-control" th:field="*{taxId}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Payment Terms</label>
                        <input type="text" class="form-control" th:field="*{paymentTerms}" placeholder="e.g. Net 30">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <textarea class="form-control" rows="2" th:field="*{address}"></textarea>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-sm-primary"><i class="bi bi-check-lg"></i> Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/suppliers}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
