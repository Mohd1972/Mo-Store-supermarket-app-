<html th:replace="~{fragments/layout :: layout('Purchase Orders', ~{::content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Purchase Orders</h5>
        <a class="btn btn-sm-primary" th:href="@{/purchase-orders/new}"><i class="bi bi-plus-lg"></i> New Order</a>
    </div>
    <div class="card">
        <div class="card-body p-0">
            <table class="table mb-0">
                <thead><tr><th>PO Number</th><th>Supplier</th><th>Status</th><th>Date</th><th>Expected Delivery</th><th class="text-end">Total</th><th></th></tr></thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td th:text="${o.poNumber}">PO</td>
                    <td th:text="${o.supplier.companyName}">supplier</td>
                    <td>
                        <span class="badge"
                              th:classappend="${o.status.name() == 'PENDING'} ? 'text-bg-warning' : (${o.status.name() == 'RECEIVED'} ? 'text-bg-success' : 'text-bg-secondary')"
                              th:text="${o.status}">PENDING</span>
                    </td>
                    <td th:text="${#temporals.format(o.orderDate, 'yyyy-MM-dd HH:mm')}">date</td>
                    <td th:text="${o.expectedDeliveryDate != null ? #temporals.format(o.expectedDeliveryDate, 'yyyy-MM-dd') : '—'}">—</td>
                    <td class="text-end" th:text="'TSh ' + ${#numbers.formatDecimal(o.total, 1, 'COMMA', 2, 'POINT')}">0</td>
                    <td><a class="btn btn-sm btn-outline-secondary" th:href="@{/purchase-orders/{id}(id=${o.id})}">View</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="7" class="text-center text-muted">No purchase orders</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
