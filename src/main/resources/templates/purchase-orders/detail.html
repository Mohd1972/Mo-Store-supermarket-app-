<html th:replace="~{fragments/layout :: layout('Order ' + ${order.poNumber}, ~{::content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="card mb-3">
        <div class="card-body">
            <div class="row">
                <div class="col-md-3"><strong>PO Number:</strong> <span th:text="${order.poNumber}"></span></div>
                <div class="col-md-3"><strong>Supplier:</strong> <span th:text="${order.supplier.companyName}"></span></div>
                <div class="col-md-3"><strong>Status:</strong>
                    <span class="badge"
                          th:classappend="${order.status.name() == 'PENDING'} ? 'text-bg-warning' : (${order.status.name() == 'RECEIVED'} ? 'text-bg-success' : 'text-bg-secondary')"
                          th:text="${order.status}"></span>
                </div>
                <div class="col-md-3"><strong>Order date:</strong> <span th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}"></span></div>
                <div class="col-md-3"><strong>Expected delivery:</strong>
                    <span th:text="${order.expectedDeliveryDate != null ? #temporals.format(order.expectedDeliveryDate, 'yyyy-MM-dd') : '—'}">—</span>
                </div>
                <div class="col-12" th:if="${order.notes != null && !order.notes.isEmpty()}">
                    <strong>Notes:</strong> <span th:text="${order.notes}"></span>
                </div>
            </div>
            <div class="mt-3" th:if="${order.status.name() == 'PENDING'}">
                <form class="d-inline" th:action="@{/purchase-orders/{id}/receive(id=${order.id})}" method="post"
                      onsubmit="return confirm('Receive this order and update stock?')">
                    <button class="btn btn-sm-primary" type="submit"><i class="bi bi-box-arrow-in-down"></i> Receive Order</button>
                </form>
                <form class="d-inline" th:action="@{/purchase-orders/{id}/cancel(id=${order.id})}" method="post"
                      onsubmit="return confirm('Cancel this order?')">
                    <button class="btn btn-outline-danger btn-sm" type="submit"><i class="bi bi-x-circle"></i> Cancel</button>
                </form>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-white fw-bold">Items</div>
        <div class="card-body p-0">
            <table class="table mb-0">
                <thead><tr><th>Product</th><th class="text-end">Unit Cost</th><th class="text-center">Qty</th><th class="text-end">Line Total</th></tr></thead>
                <tbody>
                <tr th:each="item : ${order.items}">
                    <td th:text="${item.product.name}">product</td>
                    <td class="text-end" th:text="'TSh ' + ${#numbers.formatDecimal(item.unitCost, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td class="text-center" th:text="${item.quantity}"></td>
                    <td class="text-end" th:text="'TSh ' + ${#numbers.formatDecimal(item.lineTotal, 1, 'COMMA', 2, 'POINT')}"></td>
                </tr>
                </tbody>
                <tfoot>
                <tr><th colspan="3" class="text-end">Total</th><th class="text-end" th:text="'TSh ' + ${#numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT')}"></th></tr>
                </tfoot>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <a class="btn btn-outline-secondary" th:href="@{/purchase-orders}"><i class="bi bi-arrow-left"></i> Back</a>
    </div>
</div>
</body>
</html>
