<html th:replace="~{fragments/layout :: layout(${mode == 'edit' ? 'Edit Product' : 'New Product'}, ~{::content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="card">
        <div class="card-body">
            <form th:action="${mode == 'edit'} ? @{/products/{id}(id=${product.id})} : @{/products}" method="post"
                  th:object="${product}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" th:field="*{name}" required>
                        <div class="text-danger" th:errors="*{name}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">SKU</label>
                        <input type="text" class="form-control" th:field="*{sku}" required>
                        <div class="text-danger" th:errors="*{sku}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Barcode</label>
                        <input type="text" class="form-control" th:field="*{barcode}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Brand</label>
                        <input type="text" class="form-control" th:field="*{brand}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Unit</label>
                        <input type="text" class="form-control" th:field="*{unitOfMeasure}" placeholder="kg, box, unit">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Category</label>
                        <select class="form-select" name="categoryId">
                            <option value="">-- Select --</option>
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                                    th:selected="${product.category != null && product.category.id == c.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Supplier</label>
                        <select class="form-select" name="supplierId">
                            <option value="">-- Select --</option>
                            <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.companyName}"
                                    th:selected="${product.supplier != null && product.supplier.id == s.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Price ($)</label>
                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{price}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Cost ($)</label>
                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{cost}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Stock</label>
                        <input type="number" min="0" class="form-control" th:field="*{stock}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Reorder Level</label>
                        <input type="number" min="0" class="form-control" th:field="*{reorderLevel}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Tax Rate (%)</label>
                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{taxRate}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Manufacture Date</label>
                        <input type="date" class="form-control" th:field="*{manufactureDate}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Expiry Date</label>
                        <input type="date" class="form-control" th:field="*{expiryDate}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Warehouse Location</label>
                        <input type="text" class="form-control" th:field="*{warehouseLocation}" placeholder="Aisle/Bin">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Batch/Lot Number</label>
                        <input type="text" class="form-control" th:field="*{batchLotNumber}">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" rows="2" th:field="*{description}"></textarea>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-sm-primary">
                        <i class="bi bi-check-lg"></i> Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/products}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
