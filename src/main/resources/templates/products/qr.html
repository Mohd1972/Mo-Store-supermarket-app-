<html th:replace="~{fragments/layout :: layout('QR Code', ~{::content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center">
                    <h5 th:text="${product.name}">Product</h5>
                    <div class="text-muted small mb-3">
                        <div>SKU: <span th:text="${product.sku}">SKU</span></div>
                        <div th:if="${product.barcode != null && !product.barcode.isEmpty()}">
                            Barcode: <span th:text="${product.barcode}"></span>
                        </div>
                    </div>
                    <canvas id="qr-canvas" class="border rounded d-inline-block p-2"></canvas>
                    <div class="mt-2 text-muted" id="code-label"></div>
                    <div class="mt-3">
                        <a class="btn btn-outline-secondary" th:href="@{/products}"><i class="bi bi-arrow-left"></i> Back</a>
                        <button class="btn btn-sm-primary" onclick="window.print()"><i class="bi bi-printer"></i> Print</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/qrcode.js}"></script>
    <script>
        (function () {
            var code = /*[[${product.barcode != null && !product.barcode.isEmpty() ? product.barcode : product.sku}]]*/ '';
            if (typeof code !== 'string') code = String(code);
            document.getElementById('code-label').textContent = code;
            var canvas = document.getElementById('qr-canvas');
            try {
                var qr = QR.generate(code, { ecLevel: 'M' });
                QR.draw(qr.modules, canvas, 4);
            } catch (e) {
                canvas.width = 280;
                canvas.height = 80;
                var ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 280, 80);
                ctx.fillStyle = '#dc3545';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('QR generation failed: ' + e.message, 140, 44);
            }
        })();
    </script>
</div>
</body>
</html>
