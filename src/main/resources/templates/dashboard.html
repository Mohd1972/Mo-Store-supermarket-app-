<html th:replace="~{fragments/layout :: layout('Dashboard', ~{::content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card stat-card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">Today's Revenue</div>
                        <div class="fs-4 fw-bold" th:text="'TSh ' + ${#numbers.formatDecimal(dashboard['todayRevenue'], 1, 'COMMA', 2, 'POINT')}">0</div>
                    </div>
                    <i class="bi bi-cash-stack text-success icon"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">Today's Sales</div>
                        <div class="fs-4 fw-bold" th:text="${dashboard['todaySales']}">0</div>
                    </div>
                    <i class="bi bi-receipt text-primary icon"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">Total Products</div>
                        <div class="fs-4 fw-bold" th:text="${dashboard['totalProducts']}">0</div>
                    </div>
                    <i class="bi bi-box-seam text-info icon"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">Low Stock Alerts</div>
                        <div class="fs-4 fw-bold text-danger" th:text="${dashboard['lowStockCount']}">0</div>
                    </div>
                    <i class="bi bi-exclamation-triangle text-danger icon"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-7">
            <div class="card">
                <div class="card-header bg-white fw-bold">Top Products (Last 30 Days)</div>
                <div class="card-body p-0">
                    <table class="table mb-0">
                        <thead><tr><th>Product</th><th>Qty Sold</th><th>Revenue</th></tr></thead>
                        <tbody>
                        <tr th:each="tp : ${dashboard['topProducts']}">
                            <td th:text="${tp['name']}">name</td>
                            <td th:text="${tp['quantity']}">0</td>
                            <td class="text-end" th:text="'TSh ' + ${#numbers.formatDecimal(tp['revenue'], 1, 'COMMA', 2, 'POINT')}">0</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(dashboard['topProducts'])}">
                            <td colspan="3" class="text-muted text-center">No sales yet</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card">
                <div class="card-header bg-white fw-bold text-danger">Low Stock Products</div>
                <div class="card-body p-0">
                    <table class="table mb-0">
                        <thead><tr><th>Product</th><th>Stock</th><th>Reorder</th></tr></thead>
                        <tbody>
                        <tr th:each="lp : ${lowStockProducts}">
                            <td th:text="${lp.name}">name</td>
                            <td><span class="badge badge-lowstock" th:text="${lp.stock}">0</span></td>
                            <td th:text="${lp.reorderLevel}">5</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(lowStockProducts)}">
                            <td colspan="3" class="text-muted text-center">All stock levels healthy</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a class="btn btn-sm-primary" th:href="@{/sales/pos}"><i class="bi bi-plus-circle"></i> New Sale</a>
    </div>

</div>
</body>
</html>
