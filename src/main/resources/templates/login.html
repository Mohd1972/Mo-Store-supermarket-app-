<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f1d17">
    <title>Sign in | Mo Store</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f1d17, #143a26);
            padding: 1rem;
            color-scheme: light;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            border: none;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
        }
        .brand-mark {
            width: 58px; height: 58px;
            border-radius: 16px;
            background: linear-gradient(135deg, #198754, #2fbf79);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto;
        }
        .brand-mark i { font-size: 1.7rem; color: #fff; }
        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 .2rem rgba(25, 135, 84, .15);
        }
        .btn-login {
            background: #198754;
            border: 1px solid #198754;
            border-radius: 10px;
            font-weight: 600;
            padding: .7rem 1rem;
        }
        .btn-login:hover { background: #166a44; border-color: #166a44; }
        .btn-login:focus-visible { outline: 2px solid #198754; outline-offset: 2px; }
        .hint { font-size: .85rem; }
    </style>
</head>
<body>
<div class="card auth-card">
    <div class="card-body p-4 p-md-5">
        <div class="brand-mark mb-3"><i class="bi bi-shop" aria-hidden="true"></i></div>
        <h1 class="h3 text-center fw-bold mb-1">Mo Store</h1>
        <p class="text-muted text-center mb-4">Sign in to your account</p>

        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-circle" aria-hidden="true"></i> Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success" role="alert">
            <i class="bi bi-check-circle" aria-hidden="true"></i> You have been signed out.
        </div>

        <form th:action="@{/login}" method="post" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white" title=""><i class="bi bi-person" aria-hidden="true"></i></span>
                    <input type="text" class="form-control" id="username" name="username"
                           autocomplete="username" autofocus required>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white" title=""><i class="bi bi-lock" aria-hidden="true"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                           autocomplete="current-password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-login btn-success w-100 text-white">
                <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Sign in
            </button>
        </form>

        <p class="hint text-muted text-center mt-4 mb-0">
            Default admin: <strong>admin</strong> / <strong>admin123</strong>
        </p>
    </div>
</div>
</body>
</html>
